name: Deploy Spring Boot Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Inject application.properties
        env:
          APP_PROPS: ${{ secrets.APPLICATION_PROPERTIES }}
        run: |
          mkdir -p src/main/resources
          echo "$APP_PROPS" > src/main/resources/application.properties

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/chat-0.0.1-SNAPSHOT.jar"
          # IMPORTANT: Update this to exactly where your JAR lives on the EC2 server
          target: "/home/ubuntu/" 
          strip_components: 1 # Strips the 'target/' folder so only the jar is copied

      - name: Restart Spring Boot Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart springboot
