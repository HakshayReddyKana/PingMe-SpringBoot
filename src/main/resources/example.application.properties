spring.application.name=chat

spring.datasource.url=jdbc:postgresql://localhost:5432/CompleteTutorial
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG

# Google OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=YOUR-CLIENT-ID-HERE
spring.security.oauth2.client.registration.google.client-secret=YOUR-CLIENT-SECRET-HERE

# GitHub OAuth2 configuration
spring.security.oauth2.client.registration.github.client-id=YOUR-CLIENT-ID-HERE
spring.security.oauth2.client.registration.github.client-secret=YOUR-CLIENT-SECRET-HERE

app.client.url=https://localhost:3000

management.endpoints.web.exposure.include=*

# Enable SSL ; : DISABLING SINCE AWS EC2 AND NGINX WILL HANDLE SSL TERMINATION
#server.ssl.enabled=true
#server.ssl.key-store-type=PKCS12
#server.ssl.key-store=classpath:keystore.p12
#server.ssl.key-store-password=password
#server.ssl.key-alias=local-ssl

# Change port to 8443 (Standard for HTTPS dev) or keep 8080
server.port=8080
server.forward-headers-strategy=framework

# Tell Chrome to always send the temporary OAuth session cookie
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
